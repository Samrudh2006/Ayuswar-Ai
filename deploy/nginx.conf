server {
    listen 80;
    listen 5173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json;

    # Security Headers for Healthcare Data
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=(self)" always;

    # Prometheus simulated metrics endpoint
    location /metrics {
        default_type text/plain;
        return 200 "# HELP ayuswar_audio_rtf Real Time Factor of Gnani Timbre DSP\n# TYPE ayuswar_audio_rtf gauge\nayuswar_audio_rtf 0.18\n# HELP ayuswar_wheeze_detections_total Wheeze episodes detected in 400-800Hz\n# TYPE ayuswar_wheeze_detections_total counter\nayuswar_wheeze_detections_total 42\n# HELP ayuswar_abdm_fhir_validations_total ABDM M3 FHIR R4 JSON bundles certified\n# TYPE ayuswar_abdm_fhir_validations_total counter\nayuswar_abdm_fhir_validations_total 1240\n# HELP ayuswar_sanjivani_108_dispatches Sanjivani-108 emergency ambulance dispatches\n# TYPE ayuswar_sanjivani_108_dispatches counter\nayuswar_sanjivani_108_dispatches 18\n";
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|wav)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
