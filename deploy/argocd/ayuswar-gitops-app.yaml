# ==============================================================================
# AYUSWAR AI — ARGOCD GITOPS DECLARATIVE APPLICATION SPECIFICATION
# Continuous Delivery with Automated Reconciliation & Self-Healing
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ayuswar-ai-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/Samrudh2006/Ayuswar-Ai.git'
    targetRevision: HEAD
    path: deploy/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ayuswar-health
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

