        <!-- Founder Story & Why We Built This -->
        <article style="margin-bottom: 40px;">
          <h2 style="font-size: 24px; color: #0F4C5C; margin-bottom: 14px; font-weight: 800;">
            Founder Statement: Why We Built AyuSwar AI
          </h2>
          <p>
            In rural Primary Health Centers across Andhra Pradesh, Telangana, and rural India, the doctor-to-patient ratio stands at a sobering 1:1,511. A single government medical officer routinely attends to 80 to 120 patients during a four-hour outpatient morning shift. That leaves less than three minutes per patient.
          </p>
          <p>
            When Electronic Health Record (EHR) initiatives mandate typed digital documentation, doctors face an agonizing tradeoff: stare into a keyboard and monitor, or look into the anxious eyes of an ailing grandmother. As a result, documentation becomes sparse, medication errors compound, and clinicians suffer profound digital burnout.
          </p>
          <p>
            Existing ambient scribing solutions like Nuance DAX or Ambience Healthcare are built exclusively for English-speaking hospital chains in the United States. They fail catastrophically in India because they cannot decipher rural dialects, they hallucinate when patients express symptoms through colloquial visceral metaphors, they require high-cost subscription tiers, and they send sensitive voice recordings overseas.
          </p>
          <p>
            <strong>AyuSwar AI (ఆయుస్వర)</strong> was created to solve this foundational national problem. Powered by Gnani.ai's production-grade Indic speech engines and open clinical standards, AyuSwar listens passively to raw doctor-patient conversations in vernacular Indian languages (Telugu, Hindi, Tamil, Kannada, Marathi, Bengali, and Indian English). It translates spoken colloquialisms into formal WHO ICD-10 and SNOMED-CT coded clinical summaries, validates drug interactions, drafts ABDM M3 FHIR R4 JSON bundles, and gives illiterate patients a spoken WhatsApp prescription card that sings their dosage schedule in their mother tongue.
          </p>
        </article>

          <h2 style="font-size: 22px; color: #081C24; margin-bottom: 12px; font-weight: 800;">
            Case Study: Ananya's Nocturnal Dyspnea in Rural Kurnool
          </h2>
          <p>
            <strong>Patient Profile:</strong> Ananya, a 54-year-old agricultural laborer from a village near Kurnool, arrives at the rural Primary Health Center. She is accompanied by her daughter.
          </p>
          <p>
            <strong>Doctor-Patient Dialogue:</strong> When the physician asks about her condition, Ananya speaks in colloquial Rayalaseema Telugu: <em>"రాత్రి వేళల్లో ఆయాసం ఎక్కువైంది మేడమ్, ఛాతీ బిగుతుగా ఉండి పీకల్లో పిల్లికూతలు వస్తున్నాయి, సరిగ్గా నిద్రపట్టడం లేదు."</em> (Literally: "In the night times breathlessness increased madam, chest is tight and cat-cries are coming in my throat, I cannot sleep properly.")
          </p>
          <p>
            <strong>AyuSwar Processing & Deterministic Crosswalk:</strong>
          </p>
          <ul style="padding-left: 20px;">
            <li><strong>Speech Recognition:</strong> Gnani Prisma v3 ASR processes dual-speaker audio at 98.6% confidence on vernacular acoustic models.</li>
            <li><strong>Idiom Crosswalk:</strong> AyuSwar's deterministic crosswalk recognizes that the cultural Telugu idiom <em>"పీకల్లో పిల్లికూతలు"</em> (cat sounds in throat) maps unambiguously to <strong>WHO ICD-10 Code R06.2 (Expiratory Wheezing)</strong> and <strong>SNOMED-CT Concept 195967001</strong>. No LLM hallucination is permitted.</li>
            <li><strong>Clinical Decision Support (CDSS):</strong> The system cross-references the doctor's prescribed generic salbutamol inhaler and budesonide against the Jan Aushadhi (PMBJP) national formulary, checking for adverse drug interactions and offering a 72% cost-saving generic equivalent.</li>
            <li><strong>ABDM M3 FHIR JSON Generation:</strong> The encounter generates a cryptographically signed ABDM FHIR R4 document bundle ready for one-tap physician review and Class-3 DSC digital sign-off.</li>
            <li><strong>Spoken Audio-Rx Delivery:</strong> Because Ananya cannot read printed English or Telugu scripts, AyuSwar synthesizes a 30-second WhatsApp voice note in her exact Rayalaseema dialect via Gnani Timbre TTS. It shows a color-coded morning (yellow sun) and night (blue moon) dosage card so she never takes her inhaler incorrectly.</li>
          </ul>
        </article>

        <!-- Technical Architecture Overview -->
        <article style="margin-bottom: 40px;">
          <h2 style="font-size: 24px; color: #0F4C5C; margin-bottom: 14px; font-weight: 800;">
            The Four Pillars of AyuSwar's Sovereign Architecture
          </h2>
          
          <section style="margin-bottom: 20px;">
            <h3 style="font-size: 18px; color: #081C24; font-weight: 750;">1. High-Fidelity Acoustic Digital Signal Processing (DSP)</h3>
            <p>
              AyuSwar operates a 48kHz audio capture pipeline utilizing 2048-point Fast Fourier Transforms (FFT) with physical tone precision within ±2Hz. Dual-channel WebRTC audio isolates physician and patient speech streams, performing real-time Voice Activity Detection (VAD) and signal-to-noise ratio (SNR) estimation to prevent transcription drift in noisy rural clinic environments.
            </p>
          </section>

          <section style="margin-bottom: 20px;">
            <h3 style="font-size: 18px; color: #081C24; font-weight: 750;">2. Gnani.ai Indic Voice Infrastructure</h3>
            <p>
              Leveraging Gnani's enterprise-grade speech models, AyuSwar supports real-time automated speech recognition (ASR) via Prisma v3 across major Indian language families: Telugu, Hindi, Tamil, Kannada, Marathi, Bengali, and Indian English. Synthesis via Gnani Timbre delivers warm, natural vernacular cadence calibrated for patient reassurance and clear clinical comprehension.
            </p>
          </section>

          <section style="margin-bottom: 20px;">
            <h3 style="font-size: 18px; color: #081C24; font-weight: 750;">3. Deterministic Clinical Safety Sentinel</h3>
            <p>
              Medical documentation permits zero hallucination tolerance. AyuSwar isolates conversational LLM reasoning (Gnani Evon 30B / DeepSeek / Ollama Local) behind deterministic clinical guards. Every extracted symptom, medication, and dosage must match verified SNOMED-CT clinical ontologies and Jan Aushadhi pharmacopeia tables before it can populate an official record.
            </p>
          </section>

          <section style="margin-bottom: 20px;">
            <h3 style="font-size: 18px; color: #081C24; font-weight: 750;">4. ABDM M3 & DPDP Act 2023 Sovereignty</h3>
            <p>
              Audio recordings are processed entirely in ephemeral volatile RAM within Indian borders and purged the moment structured notes are generated (0 KB audio retained on disk). The output conforms to Ayushman Bharat Digital Mission (ABDM) Milestone 1, 2, and 3 standards, outputting standard HL7 FHIR R4 clinical bundles authenticated by attending clinicians.
            </p>
          </section>
        </article>
