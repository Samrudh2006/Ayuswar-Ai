<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Diya Golden Life Flame Gradient -->
    <linearGradient id="deepamFlameGrad" x1="32" y1="12" x2="32" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Diya Silk Petrol Teal Bowl Gradient -->
    <linearGradient id="diyaBowlGrad" x1="16" y1="36" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#155E71" />
      <stop offset="50%" stop-color="#0F4C5C" />
      <stop offset="100%" stop-color="#08232C" />
    </linearGradient>

    <!-- Gold Metallic Rim Gradient -->
    <linearGradient id="goldRimGrad" x1="16" y1="36" x2="48" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Ruby Heartbeat Glow Filter -->
    <filter id="rubyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#D64550" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Circular Midnight Teal Backdrop for Contrast & Favicon Sharpness -->
  <circle cx="32" cy="32" r="30" fill="#081C24" stroke="#D4AF37" stroke-width="2" />

  <!-- Acoustic Resonance Rings (Left) -->
  <path d="M 12 22 A 16 16 0 0 0 12 42" stroke="#0F4C5C" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />
  <path d="M 16 26 A 10 10 0 0 0 16 38" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity="0.95" />

  <!-- Acoustic Resonance Rings (Right) -->
  <path d="M 48 26 A 10 10 0 0 1 48 38" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity="0.95" />
  <path d="M 52 22 A 16 16 0 0 1 52 42" stroke="#0F4C5C" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />

  <!-- Diya Sacred Flame (Lamp of Life) -->
  <path d="M 32 13 C 37 20 42 25 39 33 C 36 38 28 38 25 33 C 22 25 27 20 32 13 Z" fill="url(#deepamFlameGrad)" />
  <ellipse cx="32" cy="27" rx="3.5" ry="6" fill="#FFFBEB" opacity="0.85" />

  <!-- Diya Base (The Vessel / Ayu) -->
  <path d="M 17 37 C 17 47 47 47 47 37 C 44 41 20 41 17 37 Z" fill="url(#diyaBowlGrad)" />
  <ellipse cx="32" cy="37" rx="15" ry="2.2" fill="url(#goldRimGrad)" />
  <!-- Lotus Foot of the Diya -->
  <path d="M 28 45 C 30 47 34 47 36 45 Z" fill="#D4AF37" />

  <!-- Living Heartbeat Pulse Line (Ruby Alert ECG) -->
  <path d="M 18 32 L 23 32 L 25 36 L 29 16 L 33 42 L 36 26 L 39 32 L 46 32"
        stroke="#D64550"
        stroke-width="2.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#rubyGlow)" />
</svg>